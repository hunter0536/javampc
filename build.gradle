plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version '3.0.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'pmd'
    id 'com.google.osdetector' version '1.7.3'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

// 配置 IDEA 输出目录
idea {
    module {
        outputDir = file('build/classes/java/main')
        testOutputDir = file('build/classes/java/test')
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.xerial:sqlite-jdbc:3.41.2.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.79'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcutil-jdk18on:1.77'
    implementation 'com.google.guava:guava:32.0.0-jre'
    implementation 'io.netty:netty-all:4.1.97.Final'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
        events "passed", "skipped", "failed"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-Xlint:unchecked')
    options.compilerArgs.add('-Xlint:deprecation')
}

pmd {
    toolVersion = '6.55.0'
    rulesMinimumPriority = 5
    ruleSets = []
    ruleSetFiles = files('config/pmd/ruleset.xml')
    ignoreFailures = true
}

// 为每个节点创建构建任务
for (int i = 1; i <= 5; i++) {
    task "bootRunNode${i}"(type: org.springframework.boot.gradle.tasks.run.BootRun) {
        group = 'application'
        description = "Run node ${i}"
        args = ["--spring.profiles.active=node${i}"]
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.example.mpc.MpcApplication'
    }
}

// 原生库编译任务
tasks.register('buildNative', Exec) {
    group = 'build'
    description = 'Build GMP JNI native library (static linked, no runtime dependency)'

    workingDir projectDir
    commandLine 'bash', 'src/main/resources/native/gmp/build_native.sh', '--static'

    onlyIf {
        file('src/main/resources/native/gmp/mpc_gmp.c').exists()
    }
}

// 动态链接版本（需要目标机器安装 GMP）
tasks.register('buildNativeDynamic', Exec) {
    group = 'build'
    description = 'Build GMP JNI native library (dynamic linked, requires GMP at runtime)'

    workingDir projectDir
    commandLine 'bash', 'src/main/resources/native/gmp/build_native.sh', '--dynamic'

    onlyIf {
        file('src/main/resources/native/gmp/mpc_gmp.c').exists()
    }
}

// 运行 GMP 性能测试
tasks.register('benchmarkGMP', JavaExec) {
    group = 'verification'
    description = 'Run GMP native library benchmark'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.mpc.cggmp.util.NativeBigIntegerBenchmark'

    dependsOn 'compileJava'
}

tasks.register('compileNative', DefaultTask) {
    group = 'build'
    description = 'Compile GMP JNI native library (incremental)'

    inputs.file('src/main/resources/native/gmp/mpc_gmp.c')
            .skipWhenEmpty()
            .optional()
    outputs.file('src/main/resources/native/gmp/libmpc_gmp.dylib')

    doLast {
        def nativeSrc = file('src/main/resources/native/gmp/mpc_gmp.c')
        def nativeLib = file('src/main/resources/native/gmp/libmpc_gmp.dylib')

        if (nativeSrc.exists()) {
            logger.lifecycle("Compiling native library from ${nativeSrc.name}")
            exec {
                workingDir projectDir
                commandLine 'bash', 'src/main/resources/native/gmp/build_native.sh'
            }
        }
    }
}

tasks.named('processResources') {
    dependsOn 'compileNative'
}

tasks.named('compileJava') {
    dependsOn 'compileNative'
}
