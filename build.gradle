plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version '3.0.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'pmd'
    id 'com.google.osdetector' version '1.7.3'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

// 配置 IDEA 输出目录
idea {
    module {
        outputDir = file('build/classes/java/main')
        testOutputDir = file('build/classes/java/test')
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.xerial:sqlite-jdbc:3.40.1.0'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.77'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'
    implementation 'org.bouncycastle:bcutil-jdk18on:1.77'
    implementation 'com.google.guava:guava:32.0.0-jre'
    implementation 'io.netty:netty-all:4.1.97.Final'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    
    // GPU 加速库依赖配置
    // JCuda (NVIDIA GPU):
    // 核心库（注意：natives包不支持M芯片Mac，已手动下载到src/main/resources/native/）
    implementation('org.jcuda:jcuda:11.8.0') {
        exclude group: 'org.jcuda', module: 'jcuda-natives'
    }
    // JOCL (OpenCL，支持包括M芯片在内的多种GPU):
    // 核心库
    implementation('org.jocl:jocl:2.0.6') {
        exclude group: 'org.jocl', module: 'jocl-natives'
    }
    // 注意：native库已手动下载到src/main/resources/native/

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-Xlint:unchecked')
    options.compilerArgs.add('-Xlint:deprecation')
}

pmd {
    toolVersion = '6.55.0'
    rulesMinimumPriority = 5
    ruleSets = []
    ruleSetFiles = files('config/pmd/ruleset.xml')
}

// 为每个节点创建构建任务
for (int i = 1; i <= 5; i++) {
    task "bootRunNode${i}"(type: org.springframework.boot.gradle.tasks.run.BootRun) {
        group = 'application'
        description = "Run node ${i}"
        args = ["--spring.profiles.active=node${i}"]
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.example.mpc.MpcApplication'
    }
}

// 原生库编译任务
task buildNative(type: Exec) {
    group = 'build'
    description = 'Build GMP JNI native library (static linked, no runtime dependency)'
    
    workingDir projectDir
    commandLine 'bash', 'src/main/resources/native/cpu/build_native.sh', '--static'
    
    onlyIf {
        file('src/main/native/mpc_gmp.c').exists()
    }
}

// 编译 Metal shader 为 metallib（macOS）
task buildMetalShaders(type: Exec) {
    group = 'build'
    description = 'Build Metal shader library (metallib)'

    workingDir projectDir
    commandLine 'bash', '-c', 'xcrun -sdk macosx metal -c src/main/resources/native/darwin/big_integer_shaders_complete.metal -o build/tmp/big_integer_shaders_complete.air && xcrun -sdk macosx metallib build/tmp/big_integer_shaders_complete.air -o src/main/resources/native/darwin/big_integer_shaders_complete.metallib'

    onlyIf {
        file('src/main/resources/native/darwin/big_integer_shaders_complete.metal').exists()
    }
}

// 动态链接版本（需要目标机器安装 GMP）
task buildNativeDynamic(type: Exec) {
    group = 'build'
    description = 'Build GMP JNI native library (dynamic linked, requires GMP at runtime)'
    
    workingDir projectDir
    commandLine 'bash', 'src/main/resources/native/cpu/build_native.sh', '--dynamic'
    
    onlyIf {
        file('src/main/native/mpc_gmp.c').exists()
    }
}

// 运行 GMP 性能测试
tasks.register('benchmarkGMP', JavaExec) {
    group = 'verification'
    description = 'Run GMP native library benchmark'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.mpc.cggmp.util.NativeBigIntegerBenchmark'

    dependsOn 'compileJava'
}

// 编译前自动尝试编译原生库
tasks.named('compileJava') {
    doFirst {
        if (file('src/main/native/mpc_gmp.c').exists()) {
            try {
                exec {
                    workingDir projectDir
                    commandLine 'bash', 'src/main/resources/native/cpu/build_native.sh'
                    ignoreExitValue = true
                }
            } catch (Exception e) {
                logger.warn("Native library build skipped: ${e.message}")
            }
        }
        if (file('src/main/resources/native/darwin/big_integer_shaders_complete.metal').exists()) {
            try {
                exec {
                    workingDir projectDir
                    commandLine 'bash', '-c', 'xcrun -sdk macosx metal -c src/main/resources/native/darwin/big_integer_shaders_complete.metal -o build/tmp/big_integer_shaders_complete.air && xcrun -sdk macosx metallib build/tmp/big_integer_shaders_complete.air -o src/main/resources/native/darwin/big_integer_shaders_complete.metallib'
                    ignoreExitValue = true
                }
            } catch (Exception e) {
                logger.warn("Metal shader build skipped: ${e.message}")
            }
        }
    }
}
