# 基础配置

# 服务器配置
server:
  port: 8080 # HTTP 端口（默认注释，由 application-nodeX.yml 覆盖）

# 节点配置
node:
  id: 1       # 节点 ID（默认注释，由 application-nodeX.yml 覆盖）
  port: 9000  # 节点 P2P 端口（默认注释，由 application-nodeX.yml 覆盖）

# 发现服务配置
discovery:
  # 广播目标端口（5 个节点的发现端口）
  broadcast:
    ports: 8888,8889,8890,8891,8892 # 发现广播目标端口列表

# 节点通信共享密钥（HMAC）
nodes:
  sharedSecret: "dev-shared-secret" # 节点间共享密钥（用于 HMAC 认证）
  ssl:
    enabled: true # 是否启用 TLS（私密信道）
    cert: "scripts/config/node.crt" # 本节点证书
    key: "scripts/config/node.key" # 本节点私钥
    trustCert: "scripts/config/ca.crt" # 信任根证书
  reliableBroadcast:
    enabled: true # 是否启用可靠广播 (RBC)
    retryCount: 3 # RBC 重试次数
    retryIntervalMs: 200 # RBC 重试间隔（毫秒）
    quorum: 0 # RBC 法定人数（0 表示使用默认规则）
  chaos:
    enabled: false # 是否启用消息乱序/延迟/重放
    minDelayMs: 0 # 乱序最小延迟（毫秒）
    maxDelayMs: 0 # 乱序最大延迟（毫秒）
    duplicateChance: 0 # 重放概率（0-1）
    types: "" # 仅对这些消息类型生效（逗号分隔，空表示全部）

# 日志配置
logging:
  level:
    com.example.mpc: debug # 应用日志级别

# 应用初始化配置
app:
  db:
    dir: databases # SQLite 数据库存储目录
  init:
    cggmp:
      enabled: true  # 是否启用 CGGMP 服务
    legacy:
      enabled: true  # 是否启用旧的 DKG 服务
  cggmp:
    hdEnabled: false # HD 开关：同时控制 DKG 生成 chain code 与签名使用 shift
    complaint:
      logPath: logs/complaints.jsonl # 投诉记录日志文件路径
    proof:
      kappa: 128  # Πdec/Πaff-g* 的挑战位长度（生产环境推荐值：128，提供 2^-128 可靠性）
      epsBits: 16 # Πdec/Πaff-g* 取值范围扩展位数（标准值：16）
    presign:
      retentionDays: 30 # 预签名使用记录保留天数
      usagePath: databases/node-{nodeId}/presign-usage.jsonl # 预签名使用记录路径（支持 {nodeId} 占位）
      echoEnabled: false # 是否启用 presign R1 echo
      useRbc: false # 是否对 presign R1 echo 使用 RBC
    refresh:
      paillierBits: 3072 # Paillier 密钥位数（生产环境推荐值：≥3072，提供足够安全强度）
    aux:
      paillierBits: 1536 # Paillier 密钥位数（生产环境推荐值：≥3072，提供足够安全强度）
      minPaillierBitsForProof: 1535 # =paillierBits-1 允许的最小 Paillier 模数位数（配合 3072 位目标）
      autoCheckIntervalSeconds: 60 # 自动 AUX 轮询间隔（秒）

# MPC 全局参数
mpc:
  dkg:
    echoEnabled: false # DKG 是否启用 echo 可靠性检查
    useRbc: false # DKG 是否对广播通道使用 RBC
  aux:
    statusWaitMs: 5000 # 等待 AUX 状态收集的时间（毫秒）
